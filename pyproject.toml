[project]
name = "pdf-rag-knowledge-assistant"
version = "0.1.0"
description = "Retrieval-Augmented Generation chatbot that answers questions from uploaded PDF documents."
authors = [{ name = "Zohaib Tariq" }]
readme = "README.md"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
